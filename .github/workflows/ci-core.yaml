name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diacono
    # Definimos outputs para o próximo job conseguir ler a tag e o repo gerados
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
      image_repo: ${{ steps.image.outputs.image_repo }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Gerando o Short SHA
      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # O ./mvnw roda dentro do contexto do working-directory (diacono)
      - name: Executar Testes
        run: ./mvnw -B test

      - name: Login no Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tratamento do nome do repositório para garantir letras minúsculas
      - name: Set Docker image repo
        id: image
        shell: bash
        env:
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          repo="${DOCKERHUB_REPOSITORY:-${GITHUB_REPOSITORY##*/}}"
          repo_lower=$(echo "$repo" | tr '[:upper:]' '[:lower:]')
          echo "image_repo=$repo_lower" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        if: success()
        uses: docker/build-push-action@v5
        with:
          context: diacono
          file: diacono/Dockerfile
          push: true
          # Publicamos usando o repo tratado em minúsculo
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.image.outputs.image_repo }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.image.outputs.image_repo }}:${{ steps.vars.outputs.sha_short }}

  notify-dispatch:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          # ATENÇÃO: Valide se o nome correto da variável é este ou GITHUB_USERNAME_REPONAME
          repository: ${{ vars.USERNAME_REPONAME_GITHUB }}
          event-type: core-image-updated
          # Aqui passamos a imagem e a tag dinâmicas capturadas no job anterior
          client-payload: >
            {
              "image": "${{ needs.test-and-build.outputs.image_repo }}",
              "tag": "${{ needs.test-and-build.outputs.image_tag }}"
            }